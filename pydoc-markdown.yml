loaders:
  - type: python
processors:
  - type: filter
  - type: smart
  - type: crossref
renderer:
  type: mkdocs
  markdown:
    # Show the type of each field of the FitState and of the results of fit(.)
    render_typehint_in_data_header: true
  pages:
    - title: Home
      name: index
      source: README.md
    - title: Getting Started
      source: GETTING_STARTED.md
    - title: API Documentation
      children:
      - title: Plane
        contents:
        - pyransac3d.plane.*
      - title: Cuboid
        contents:
        - pyransac3d.cuboid.*
      - title: Cylinder
        contents:
        - pyransac3d.cylinder.*
      - title: Sphere
        contents:
        - pyransac3d.sphere.*
      - title: Line
        contents:
        - pyransac3d.line.*
      - title: Circle
        contents:
        - pyransac3d.circle.*
      - title: Point
        contents:
        - pyransac3d.point.*
      - title: Fit Results
        contents:
        - pyransac3d.fit_results.*
      - title: Fit State
        contents:
        - pyransac3d.fit_state.*
      - title: Shape Generator
        contents:
        - pyransac3d.shape_generator.*
      - title: Auxiliary
        contents:
        - pyransac3d.aux_functions.*
    - title: Contributing
      source: CONTRIBUTING.md
    - title: License
      source: LICENSE
  mkdocs_config:
    site_name: pyRANSAC-3D
    site_description: Python library for fitting 3D geometric primitives to point clouds with RANSAC.
    site_url: https://leomariga.github.io/pyRANSAC-3D/
    repo_name: leomariga/pyRANSAC-3D
    repo_url: https://github.com/leomariga/pyRANSAC-3D
    plugins:
      - search
      - llmstxt:
          markdown_description: >
            pyRANSAC-3D is a Python library for fitting planes, lines, circles,
            spheres, cylinders, cuboids, and point clusters to 3D point clouds
            with RANSAC.
          sections:
            Getting Started:
              - index.md: Project overview, installation, supported shapes, and quick examples.
              - getting-started.md: Detailed guide to fitting and visualizing shapes.
            API Reference:
              - api-documentation/*.md
    theme:
      logo: "https://raw.githubusercontent.com/leomariga/pyRANSAC-3D/master/doc/icon_white.png"
      favicon: "https://raw.githubusercontent.com/leomariga/pyRANSAC-3D/master/doc/icon_black.png"
      name: material
      palette:
        primary: brown
        accent: brown
    markdown_extensions:
      - admonition
      - pymdownx.superfences
      - codehilite:
          guess_lang: false
      - toc:
          permalink: true
